name: build-dll
on:
  push:
  workflow_dispatch:
 
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: mchud-dll
          path: build/Release/mchud.dll
 
